name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write # to publish the nightly release
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate the Audio Unit
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Prsm Dawp
      - name: Package DMG
        run: |
          set -e
          R=build/plugins/prisma/Prisma_artefacts/Release
          mkdir -p dist/DAW/Plugins
          cp -R build/app/DAW_artefacts/Release/DAW.app dist/DAW/
          cp -R "$R/AU/Prisma.component" "$R/VST3/Prisma.vst3" "$R/Standalone/Prisma.app" dist/DAW/Plugins/
          # Ad-hoc signature: required on Apple Silicon; not notarised, so Gatekeeper still asks once.
          codesign --force --deep --sign - dist/DAW/DAW.app dist/DAW/Plugins/*
          ln -s /Applications dist/DAW/Applications
          cp packaging/INSTALL-ru.txt dist/DAW/
          hdiutil create -volname DAW -srcfolder dist/DAW -ov -format UDZO dist/DAW-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DAW-macOS
          path: dist/DAW-macOS.dmg
      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/DAW-macOS.dmg --prerelease --target "${{ github.sha }}" \
            --title "Nightly build" --notes "Automatic build of the latest main (${{ github.sha }}). See INSTALL-ru.txt inside the image."

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure
